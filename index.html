<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ride Assistant Pro</title>
<meta name="theme-color" content="#0E1218">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{ --bg:#0E1218; --panel:#171D27; --panel-2:#1D2531; --line:#2A3444; --text:#EDEFF3; --text-dim:#8B96A5; --amber:#F5A623; --teal:#2DD4BF; --coral:#FF5A5A; }
body[data-theme="light"]{ --bg:#F5F3EE; --panel:#FFFFFF; --panel-2:#EDEAE2; --line:#D8D3C7; --text:#161616; --text-dim:#5A5648; --amber:#B8720A; --teal:#0E8577; --coral:#C23B3B; }
body{transition:background .3s;}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; display:flex; justify-content:center; -webkit-tap-highlight-color:transparent; }
.app{ width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; padding:20px 18px 28px; }
.app-header{ display:flex; align-items:center; justify-content:space-between; padding-bottom:16px; }
.brand{ font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; }
.status-dot{ width:9px; height:9px; border-radius:50%; background:var(--text-dim); transition:background .3s; }
.status-dot.live{ background:var(--teal); box-shadow:0 0 0 3px rgba(45,212,191,0.2); }
.hero{ display:flex; align-items:center; justify-content:space-between; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px 20px; margin-bottom:12px; }
.speed-block{display:flex; align-items:baseline; gap:8px;}
.speed-value{ font-family:'Space Grotesk',sans-serif; font-size:64px; font-weight:700; line-height:1; color:var(--amber); }
.speed-value.over{color:var(--coral);}
.speed-unit{font-size:14px; color:var(--text-dim);}
.compass-block{display:flex; flex-direction:column; align-items:center; gap:6px;}
.compass{ position:relative; width:56px; height:56px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; }
.compass-n{ position:absolute; top:4px; font-size:9px; color:var(--text-dim); font-weight:600; }
.compass-needle{ width:2px; height:20px; background:var(--teal); border-radius:2px; transform-origin:bottom center; position:relative; bottom:-8px; }
.compass-label{font-size:12px; color:var(--text-dim);}
.trip-strip{ display:flex; background:var(--panel); border:1px solid var(--line); border-radius:18px; margin-bottom:12px; overflow:hidden; }
.trip-stat{ flex:1; padding:14px 8px; text-align:center; display:flex; flex-direction:column; gap:4px; }
.trip-stat:not(:last-child){border-right:1px solid var(--line);}
.trip-stat span{ font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:600; color:var(--teal); }
.trip-stat small{font-size:11px; color:var(--text-dim);}
.alert-bar{ background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:13.5px; color:var(--text-dim); line-height:1.4; margin-bottom:16px; min-height:20px; }
.alert-bar.warn{color:var(--coral); border-color:rgba(255,90,90,0.4);}
.alert-bar.ok{color:var(--teal); border-color:rgba(45,212,191,0.35);}
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:14px; margin-top:12px; }
.panel-title{ font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; color:var(--text); }
.sos-input-row{display:flex; gap:8px; position:relative;}
.sos-input-row input{ flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:10px 12px; font-size:14px; outline:none; }
.sos-input-row input:focus{border-color:var(--teal);}
.sos-buttons{display:flex; gap:8px;}
.sos-btn{ flex:1; border:none; border-radius:10px; padding:11px; font-size:13px; font-weight:600; cursor:pointer; }
.sos-btn.share{background:var(--panel-2); color:var(--teal); border:1px solid var(--teal);}
.btn-talk{ background:var(--teal); color:#04211D; border:none; border-radius:12px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; width:100%; }
.btn-talk.listening{background:var(--coral); color:#2A0000;}
.ai-status{ font-size:13px; color:var(--text-dim); line-height:1.4; min-height:16px; }
.quick-row{ display:flex; gap:3px; flex-wrap:wrap; }
.quick-btn{ flex:1 1 22%; min-width:65px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 4px; font-size:11px; cursor:pointer; text-align:center; }
.quick-btn.jam{ border-color:var(--coral); color:var(--coral); font-weight:600; }
.controls{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:14px; margin-top:12px; }
.btn-primary{ background:var(--amber); color:#1A1300; border:none; border-radius:12px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; }
.btn-primary.stop{background:var(--coral); color:#2A0000;}
.control-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.control-row label{font-size:13.5px; color:var(--text-dim);}
.stepper{display:flex; align-items:center; gap:10px;}
.stepper button{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-size:16px; cursor:pointer; }
.stepper span{ font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; min-width:38px; text-align:center; }
.toggle-btn{ border:1px solid var(--line); background:var(--panel-2); color:var(--text-dim); border-radius:20px; padding:6px 14px; font-size:12.5px; font-weight:600; cursor:pointer; }
.toggle-btn.on{background:rgba(45,212,191,0.15); border-color:var(--teal); color:var(--teal);}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <span class="brand">Ride Assistant Pro</span>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="themeToggle" class="toggle-btn">🌙 Night Mode</button>
      <span class="status-dot" id="statusDot"></span>
    </div>
  </div>

  <div class="hero">
    <div class="speed-block">
      <div class="speed-value" id="speedValue">0</div>
      <div class="speed-unit">km/h</div>
    </div>
    <div class="compass-block">
      <div class="compass">
        <span class="compass-n">N</span>
        <div class="compass-needle" id="needle"></div>
      </div>
      <div class="compass-label" id="compassLabel">--</div>
    </div>
  </div>

  <div class="panel" id="navPanel" style="display:none; flex-direction:row; align-items:center; gap:14px;">
    <div id="navIcon" style="font-size:40px; line-height:1;">⬆️</div>
    <div style="flex:1;">
      <div id="navInstruction" style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px;">--</div>
      <div id="navDistance" style="font-size:13px; color:var(--text-dim);">--</div>
    </div>
  </div>

  <div class="trip-strip">
    <div class="trip-stat"><span id="destDistVal">--</span><small>Manzil Doori</small></div>
    <div class="trip-stat"><span id="destTimeVal">--</span><small>Pahunchne ka Samay</small></div>
    <div class="trip-stat"><span id="tripDistance">0.0</span><small>Total km</small></div>
  </div>

  <div class="panel">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
      <div class="panel-title" style="margin-bottom:0;">📍 Live Map</div>
      <div style="display:flex; gap:5px;">
        <button id="recenterBtn" class="toggle-btn on" style="font-size:10px; padding:4px 6px;">🎯 My Loc</button>
      </div>
    </div>
    <div id="mapContainer" style="height:200px; border-radius:12px; overflow:hidden; background:var(--panel-2); position:relative; z-index:1;">
      <div id="liveMap" style="width:100%; height:100%;"></div>
    </div>
    <div class="ai-status" id="placeNameText" style="margin-top:6px; font-weight:600; color:var(--teal);">Location track karne ke liye "Start Ride" dabayein.</div>
  </div>

  <div class="panel">
    <div class="panel-title">🎯 Advanced Destination Search</div>
    <div class="sos-input-row">
      <input type="text" id="destInput" placeholder="College, Shop ya koi bhi jagah likhein..." autocomplete="off">
      <div id="destSuggestions" style="display:none; position:absolute; top:100%; left:0; right:0; background:var(--panel-2); border:1px solid var(--line); border-radius:0 0 10px 10px; z-index:1000; max-height:180px; overflow-y:auto; box-shadow:0 8px 20px rgba(0,0,0,0.5);"></div>
    </div>
    <div class="sos-buttons" style="margin-top:8px;">
      <button id="setDestBtn" class="sos-btn share">Set</button>
      <button id="clearDestBtn" class="sos-btn" style="background:var(--panel-2); color:var(--text-dim); border:1px solid var(--line);">Clear</button>
    </div>
    <div class="ai-status" id="destStatus"></div>
  </div>

  <div class="alert-bar" id="alertBar">Shuru karne ke liye neeche "Start Ride" dabayein.</div>

  <div class="panel">
    <div class="panel-title">🤖 Ultimate AI Saathi</div>
    <div class="sos-input-row" style="margin-bottom:8px;">
      <input type="text" id="aiChatInput" placeholder="Puchein (jaise: petrol, atm, highway)..." autocomplete="off">
      <button id="aiChatSendBtn" class="sos-btn share" style="flex:0 0 70px;">Poochein</button>
    </div>
    <button id="talkBtn" class="btn-talk">🎤 Ya Bolkar Baat karein</button>

    <div class="quick-row" style="margin-top:8px;">
      <button class="quick-btn jam" id="btnTrafficJam">🚨 Jam</button>
      <button class="quick-btn" id="nearFuel">⛽ Petrol</button>
      <button class="quick-btn" id="nearHosp">🏥 Hosp</button>
      <button class="quick-btn" id="nearHighway">🛣️ Highway</button>
      <button class="quick-btn" id="nearPump">🛠️ Pump</button>
      <button class="quick-btn" id="nearWater">💧 Water</button>
      <button class="quick-btn" id="nearKirana">🛒 Kirana</button>
      <button class="quick-btn" id="nearAtm">🏧 ATM</button>
    </div>
    <div class="ai-status" id="aiStatus" style="margin-top:8px;"></div>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn-primary">Start Ride</button>
    <div class="control-row">
      <label>Speed limit</label>
      <div class="stepper">
        <button id="limitDown">−</button>
        <span id="limitValue">60</span>
        <button id="limitUp">+</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>
<script>
const speedValueEl = document.getElementById('speedValue');
const needleEl = document.getElementById('needle');
const compassLabelEl = document.getElementById('compassLabel');
const navPanelEl = document.getElementById('navPanel');
const navIconEl = document.getElementById('navIcon');
const navInstructionEl = document.getElementById('navInstruction');
const navDistanceEl = document.getElementById('navDistance');
const alertBarEl = document.getElementById('alertBar');
const startBtn = document.getElementById('startBtn');
const limitDownBtn = document.getElementById('limitDown');
const limitUpBtn = document.getElementById('limitUp');
const limitValueEl = document.getElementById('limitValue');
const statusDot = document.getElementById('statusDot');
const themeToggle = document.getElementById('themeToggle');
const talkBtn = document.getElementById('talkBtn');
const aiStatusEl = document.getElementById('aiStatus');
const aiChatInput = document.getElementById('aiChatInput');
const aiChatSendBtn = document.getElementById('aiChatSendBtn');
const destInput = document.getElementById('destInput');
const setDestBtn = document.getElementById('setDestBtn');
const clearDestBtn = document.getElementById('clearDestBtn');
const destStatusEl = document.getElementById('destStatus');
const destSuggestionsEl = document.getElementById('destSuggestions');
const placeNameTextEl = document.getElementById('placeNameText');
const recenterBtn = document.getElementById('recenterBtn');
const btnTrafficJam = document.getElementById('btnTrafficJam');
const destDistValEl = document.getElementById('destDistVal');
const destTimeValEl = document.getElementById('destTimeVal');
const tripDistanceEl = document.getElementById('tripDistance');

let tracking = false; let watchId = null; let speedLimit = 60;
let hindi = true; let lastPos = null; let lastSpeedKmh = 0; let tripDistanceKm = 0;
let lastOverspeedSpoken = 0; let lastTurnSpoken = 0; let lastHeading = null;
let map = null; let marker = null; let destMarker = null; let routeLine = null;
let destination = null; let maplibreLayer = null;
let forceCenterOnNextUpdate = true; let isDarkMode = true;
let lastPlaceUpdateTick = 0;
let activeRouteData = null;
let routeCoordsCache = [];
let lastRerouteTime = 0;
let routeRequestPending = false;
let wakeLock = null;

limitDownBtn.addEventListener('click', () => {
  if(speedLimit > 10){ speedLimit -= 5; limitValueEl.textContent = speedLimit; }
});
limitUpBtn.addEventListener('click', () => {
  if(speedLimit < 150){ speedLimit += 5; limitValueEl.textContent = speedLimit; }
});

function toRad(v){ return v * Math.PI / 180; }
function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371; const dLat = toRad(lat2-lat1); const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Point se route (segments) ki minimum doori, meters mein
function distToRouteM(lat, lon, coords){
  if(coords.length < 2) return Infinity;
  const kx = 111320 * Math.cos(toRad(lat)), ky = 110540;
  let min = Infinity;
  for(let i = 0; i < coords.length - 1; i++){
    const ax = (coords[i][1]-lon)*kx,   ay = (coords[i][0]-lat)*ky;
    const bx = (coords[i+1][1]-lon)*kx, by = (coords[i+1][0]-lat)*ky;
    const dx = bx-ax, dy = by-ay, len2 = dx*dx + dy*dy;
    let t = len2 ? -(ax*dx + ay*dy)/len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(ax + t*dx, ay + t*dy);
    if(d < min) min = d;
  }
  return min;
}

function bearing(lat1, lon1, lat2, lon2){
  const y = Math.sin(toRad(lon2-lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (Math.atan2(y,x) * 180/Math.PI + 360) % 360;
}
function compassLabel(deg){
  const dirs = ['उत्तर N','उ-पू NE','पूर्व E','द-पू SE','दक्षिण S','द-प SW','पश्चिम W','उ-प NW'];
  return dirs[Math.round(deg / 45) % 8];
}

function speak(text){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = hindi ? 'hi-IN' : 'en-IN';
    u.rate = 1.05; u.pitch = 1.2;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function setAlert(text, kind){ alertBarEl.textContent = text; alertBarEl.className = 'alert-bar' + (kind ? ' ' + kind : ''); }
function setAiStatus(text){ aiStatusEl.textContent = text; }

function fnSetTheme(dark){
  isDarkMode = dark;
  document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
  themeToggle.textContent = isDarkMode ? '🌙 Night Mode' : '☀️ Day Mode';

  if(map){
    const styleUrl = isDarkMode ? 'https://tiles.openfreemap.org/styles/liberty' : 'https://tiles.openfreemap.org/styles/bright';
    try {
      if(maplibreLayer) map.removeLayer(maplibreLayer);
      maplibreLayer = L.maplibreGL({ style: styleUrl }).addTo(map);
      if(marker) marker.bringToFront();
    } catch(e){}
  }
}

function checkAutoTheme(){
  const hour = new Date().getHours();
  fnSetTheme(hour < 6 || hour >= 18);
}
checkAutoTheme();
themeToggle.addEventListener('click', () => fnSetTheme(!isDarkMode));

async function updatePlaceName(lat, lon){
  const now = Date.now();
  if(now - lastPlaceUpdateTick < 15000) return;
  lastPlaceUpdateTick = now;
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`, { headers: { 'Accept-Language': 'hi' } });
    const data = await res.json();
    if(data && data.display_name){
      placeNameTextEl.textContent = `📍 ${data.display_name.split(',').slice(0, 3).join(',')}`;
    }
  }catch(e){}
}

function maneuverInfo(step){
  if(!step || step.type === 'arrive') return { icon: '🏁', text: 'Manzil aa gayi' };

  const type = step.type; const mod = step.modifier || ''; const name = step.name || '';
  if(type === 'off ramp' || type === 'exit'){
    const isLeft = mod.includes('left');
    return {
      icon: isLeft ? '↙️' : '↘️',
      text: isLeft ? `Bayin taraf slip road se niche utre${name ? ' ('+name+')' : ''}` : `Dahine taraf slip road se niche utre${name ? ' ('+name+')' : ''}`
    };
  }
  if(/underpass|tunnel/.test(type)){
    return { icon: '⬇️', text: `Bridge ke niche se aage badhe${name ? ' ('+name+')' : ''}` };
  }

  const modMap = { 'right': 'Right mudiye', 'slight right': 'Halka right mudiye', 'left': 'Left mudiye', 'slight left': 'Halka left mudiye', 'uturn': 'U-turn lijiye' };
  const actionText = modMap[mod] || 'Seedhe chaliye';
  const fullText = name ? `${actionText} — ${name} par` : actionText;
  let icon = '⬆️';
  if(/right/.test(mod)) icon = '➡️';
  if(/left/.test(mod)) icon = '⬅️';
  return { icon, text: fullText };
}

// Route banata hai. alternative=true par doosra route na mile to null deta hai.
async function drawRoute(fromLat, fromLon, toLat, toLon, alternative=false){
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${fromLon},${fromLat};${toLon},${toLat}?overview=full&geometries=geojson&steps=true${alternative ? '&alternatives=true' : ''}`;
    const res = await fetch(url); const data = await res.json();
    if(!data.routes || data.routes.length === 0) return null;
    if(alternative && data.routes.length < 2) return null;

    const route = data.routes[alternative ? 1 : 0];
    const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
    routeCoordsCache = coords;

    if(map){
      if(routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline(coords, { color: '#2DD4BF', weight: 5, opacity: 0.8 }).addTo(map);
    }

    const distKm = route.distance / 1000;
    const durationMin = Math.round(route.duration / 60);
    activeRouteData = { distKm, durationMin, initialDistKm: distKm };
    destDistValEl.textContent = distKm >= 1 ? distKm.toFixed(1) + ' km' : Math.round(route.distance) + ' m';
    destTimeValEl.textContent = durationMin >= 60 ? (durationMin/60).toFixed(1) + ' hrs' : durationMin + ' min';

    const steps = route.legs[0].steps.map(s => ({
      type: s.maneuver.type, modifier: s.maneuver.modifier,
      lat: s.maneuver.location[1], lon: s.maneuver.location[0], distance: s.distance, name: s.name
    }));
    return { distanceKm: distKm, durationMin, steps, coords };
  }catch(e){}
  return null;
}

// Route banakar destination ke steps set karta hai (index reset ke saath)
async function buildRouteForDestination(fromLat, fromLon, alternative=false){
  if(!destination) return null;
  const route = await drawRoute(fromLat, fromLon, destination.lat, destination.lon, alternative);
  if(route && destination){
    destination.steps = route.steps;
    destination.currentStepIndex = 0;
  }
  return route;
}

async function handleTrafficJam(){
  speak('Rasta jam hai? Main doosra rasta dhoond raha hoon...');
  setAiStatus('Traffic jam detect kiya gaya. Doosra rasta dhoond rahe hain...');
  if(destination && lastPos){
    const alt = await buildRouteForDestination(lastPos.lat, lastPos.lon, true);
    if(alt){
      lastRerouteTime = Date.now();
      speak('Yeh lo doosra rasta mil gaya!');
      setAiStatus('Alternative route set ho gaya!');
      return;
    }
  }
  speak('Filhal koi doosra alternative route nahi mila.');
  setAiStatus('Alternative route nahi mila.');
}

function updateTurnByTurn(lat, lon){
  if(!destination || !destination.steps) return;
  const steps = destination.steps; const idx = destination.currentStepIndex || 0;
  if(idx >= steps.length){ navPanelEl.style.display = 'none'; return; }
  const next = steps[idx];
  const distToNext = haversineKm(lat, lon, next.lat, next.lon) * 1000;
  if(distToNext < 25){
    destination.currentStepIndex = idx + 1;
    updateTurnByTurn(lat, lon);
    return;
  }
  const info = maneuverInfo(next);
  navPanelEl.style.display = 'flex';
  navIconEl.textContent = info.icon;
  navInstructionEl.textContent = info.text;
  navDistanceEl.textContent = distToNext >= 1000 ? (distToNext/1000).toFixed(1) + ' km' : Math.round(distToNext) + ' m';
}

function initMap(lat, lon){
  if(map) return;
  map = L.map('liveMap', { zoomControl: false, attributionControl: false }).setView([lat, lon], 16);
  const styleUrl = isDarkMode ? 'https://tiles.openfreemap.org/styles/liberty' : 'https://tiles.openfreemap.org/styles/bright';
  maplibreLayer = L.maplibreGL({ style: styleUrl }).addTo(map);
  const bikeIcon = L.divIcon({
    className: 'bike-marker',
    html: `<div style="font-size:28px; transform:translate(-14px, -14px);">🏍️</div>`,
    iconSize: [28, 28], iconAnchor: [14, 14]
  });
  marker = L.marker([lat, lon], { icon: bikeIcon }).addTo(map);
  map.on('dragstart', () => { forceCenterOnNextUpdate = false; });
}

function updateMap(lat, lon){
  try{
    if(!map){ initMap(lat, lon); return; }
    marker.setLatLng([lat, lon]);
    if(forceCenterOnNextUpdate){
      map.setView([lat, lon], map.getZoom(), { animate: false });
    }
  }catch(e){}
}

async function findNearby(filterQuerySnippet, label, fallbackQueryText){
  if(!lastPos){
    if('geolocation' in navigator){
      setAiStatus('Location dhoond raha hoon...');
      navigator.geolocation.getCurrentPosition(async (pos) => {
        lastPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        initMap(lastPos.lat, lastPos.lon);
        await executeNearbySearch(filterQuerySnippet, label, fallbackQueryText);
      }, () => {
        setAiStatus('Location permission dein ya "Start Ride" dabayein.');
        speak('Pehle start ride dabayein.');
      }, { enableHighAccuracy: true });
    } else {
      setAiStatus('GPS support nahi hai.');
    }
    return;
  }
  await executeNearbySearch(filterQuerySnippet, label, fallbackQueryText);
}

async function executeNearbySearch(filterQuerySnippet, label, fallbackQueryText){
  setAiStatus(`Najdeek ${label} dhoond raha hoon...`);

  let mapped = [];
  try {
    const q = `[out:json][timeout:15];(${filterQuerySnippet}(around:15000,${lastPos.lat},${lastPos.lon}););out center 20;`;
    const res = await fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q));
    if(res.ok){
      const data = await res.json();
      if(data && data.elements){
        mapped = data.elements.map(e => {
          let lat = e.lat; let lon = e.lon;
          if(lat == null && e.center){ lat = e.center.lat; lon = e.center.lon; }
          if(lat == null && e.geometry && e.geometry.length > 0){ lat = e.geometry[0].lat; lon = e.geometry[0].lon; }
          return {
            name: e.tags?.name || e.tags?.brand || label,
            lat: lat, lon: lon,
            dist: (lat != null && lon != null) ? haversineKm(lastPos.lat, lastPos.lon, lat, lon) : 9999
          };
        }).filter(item => item.lat != null && item.lon != null && !isNaN(item.lat) && !isNaN(item.lon)).sort((a,b) => a.dist - b.dist);
      }
    }
  } catch(e) {}

  if(mapped.length === 0 && fallbackQueryText){
    try {
      const nomUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fallbackQueryText)}&viewbox=${lastPos.lon-0.15},${lastPos.lat+0.15},${lastPos.lon+0.15},${lastPos.lat-0.15}&bounded=1&limit=5`;
      const nomRes = await fetch(nomUrl, { headers: { 'Accept-Language': 'hi,en' } });
      const nomData = await nomRes.json();
      if(nomData && nomData.length > 0){
        mapped = nomData.map(item => ({
          name: item.display_name.split(',')[0],
          lat: parseFloat(item.lat),
          lon: parseFloat(item.lon),
          dist: haversineKm(lastPos.lat, lastPos.lon, parseFloat(item.lat), parseFloat(item.lon))
        })).sort((a,b) => a.dist - b.dist);
      }
    }catch(e){}
  }

  if(mapped.length === 0){
    setAiStatus(`Aaspaas koi ${label} nahi mila.`);
    speak(`Aaspaas koi ${label} nahi mila.`);
    return;
  }

  const nearest = mapped[0];
  const distStr = nearest.dist < 1 ? Math.round(nearest.dist * 1000) + ' meter' : nearest.dist.toFixed(1) + ' kilometer';

  await setDestination(nearest.lat, nearest.lon, `${nearest.name} (${label})`);

  const txt = `Sabse najdeek ${label}: ${nearest.name}, ${distStr} door hai. Rasta set kar diya gaya hai!`;
  setAiStatus(txt);
  speak(txt);
}

const Q = {
  fuel: 'nwr["amenity"="fuel"]',
  hospital: 'nwr["amenity"="hospital"]',
  highway: 'way["highway"~"^(motorway|trunk)$"]',
  tyre: 'nwr["shop"="tyre"]',
  water: 'nwr["amenity"="drinking_water"]',
  kirana: 'nwr["shop"~"^(convenience|supermarket|general)$"]',
  snack: 'nwr["shop"="supermarket"]',
  hotel: 'nwr["tourism"="hotel"]',
  atm: 'nwr["amenity"="atm"]'
};

async function handleUserQuery(text){
  const t = text.toLowerCase().trim();
  setAiStatus('Aapne kaha: "' + text + '"');

  if(/jam|traffic|bheed|जाम|ट्रैफिक/.test(t)){ await handleTrafficJam(); return; }
  if(/highway|haivay|हाइवे/.test(t)){ await findNearby(Q.highway, 'highway', 'highway'); return; }

  if(/manzil|destination|kitni door|kitna door|dur kitna|pahunchna/.test(t)){
    if(destination && lastPos){
      const d = haversineKm(lastPos.lat, lastPos.lon, destination.lat, destination.lon);
      const r = `Manzil ${destination.name} abhi ${d.toFixed(1)} kilometer door hai.`;
      setAiStatus(r); speak(r); return;
    } else {
      const r = 'Aapne abhi koi destination set nahi kiya hai.';
      setAiStatus(r); speak(r); return;
    }
  }

  if(/speed|kitni speed|गति/.test(t)){ const r = `Aapki speed ${lastSpeedKmh} km/h hai.`; setAiStatus(r); speak(r); return; }
  if(/kahan|location|कहाँ/.test(t)){ const r = placeNameTextEl.textContent; setAiStatus(r); speak(r); return; }

  if(/petrol|fuel|diesel|पेट्रोल/.test(t)){ await findNearby(Q.fuel, 'petrol pump', 'petrol pump'); return; }
  if(/hospital|doctor|clinic|अस्पताल|डॉक्टर/.test(t)){ await findNearby(Q.hospital, 'hospital', 'hospital'); return; }
  if(/hawa|\bair\b|tyre|puncture|पंचर|पंप/.test(t)){ await findNearby(Q.tyre, 'air & puncture shop', 'puncture shop'); return; }
  if(/pani|water|paani|पानी/.test(t)){ await findNearby(Q.water, 'water point', 'drinking water'); return; }
  if(/kirana|rashan|grocery|किराना|राशन/.test(t)){ await findNearby(Q.kirana, 'kirana store', 'grocery store'); return; }
  if(/chocolate|sweet|khane|food|चॉकलेट|खाना/.test(t)){ await findNearby(Q.snack, 'snack store', 'supermarket'); return; }
  if(/hotel|room|rukne|होटल/.test(t)){ await findNearby(Q.hotel, 'hotel', 'hotel'); return; }
  if(/atm|paisa|एटीएम/.test(t)){ await findNearby(Q.atm, 'ATM', 'ATM'); return; }

  const generalReply = `Maine sun liya: "${text}" — Main yahin hoon, safe ride karein!`;
  setAiStatus(generalReply);
  speak(generalReply);
}

aiChatSendBtn.addEventListener('click', () => {
  const val = aiChatInput.value.trim();
  if(!val) return;
  aiChatInput.value = '';
  handleUserQuery(val);
});
aiChatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') aiChatSendBtn.click(); });

let searchTimeout = null;
destInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const q = destInput.value.trim();
  if(q.length < 3){ destSuggestionsEl.style.display = 'none'; return; }

  searchTimeout = setTimeout(async () => {
    try {
      let viewboxParam = '';
      if(lastPos){
        const delta = 0.5;
        viewboxParam = `&viewbox=${lastPos.lon - delta},${lastPos.lat + delta},${lastPos.lon + delta},${lastPos.lat - delta}&bounded=0`;
      }
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6&addressdetails=1${viewboxParam}`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'hi,en' } });
      const results = await res.json();

      if(!results || results.length === 0){ destSuggestionsEl.style.display = 'none'; return; }

      destSuggestionsEl.innerHTML = '';
      results.forEach(item => {
        const div = document.createElement('div');
        div.className = 'dest-suggestion-item';
        div.style.cssText = 'padding:11px 12px; font-size:13px; border-bottom:1px solid var(--line); cursor:pointer; background:var(--panel-2); color:var(--text); display:flex; align-items:center; gap:8px;';

        const iconSpan = document.createElement('span');
        iconSpan.textContent = '📍';
        iconSpan.style.fontSize = '16px';

        const textSpan = document.createElement('span');
        textSpan.style.cssText = 'overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
        textSpan.textContent = item.display_name;

        div.appendChild(iconSpan);
        div.appendChild(textSpan);
        div.addEventListener('click', () => {
          setDestination(parseFloat(item.lat), parseFloat(item.lon), item.display_name.split(',')[0]);
        });
        destSuggestionsEl.appendChild(div);
      });
      destSuggestionsEl.style.display = 'block';
    } catch(e) { destSuggestionsEl.style.display = 'none'; }
  }, 500);
});

document.addEventListener('click', (e) => {
  if(!destInput.contains(e.target) && !destSuggestionsEl.contains(e.target)){
    destSuggestionsEl.style.display = 'none';
  }
});

async function setDestination(lat, lon, name){
  destination = { lat, lon, name, currentStepIndex: 0, steps: null };
  activeRouteData = null; routeCoordsCache = [];
  destInput.value = name;
  destSuggestionsEl.style.display = 'none';
  destStatusEl.textContent = `🎯 ${name} set ho gaya!`;
  if(map){
    if(destMarker) map.removeLayer(destMarker);
    destMarker = L.marker([lat, lon]).addTo(map).bindPopup(name);
  }
  if(lastPos){
    await buildRouteForDestination(lastPos.lat, lastPos.lon);
  }
  // lastPos nahi hai to pehle GPS fix par handlePosition route bana dega
}

setDestBtn.addEventListener('click', async () => {
  const query = destInput.value.trim(); if(!query) return;
  destSuggestionsEl.style.display = 'none';
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
    const results = await res.json();
    if(!results.length){ destStatusEl.textContent = 'Jagah nahi mili.'; return; }
    setDestination(parseFloat(results[0].lat), parseFloat(results[0].lon), results[0].display_name.split(',')[0]);
  }catch(e){ destStatusEl.textContent = 'Error aayi.'; }
});

clearDestBtn.addEventListener('click', () => {
  destination = null; destInput.value = ''; destSuggestionsEl.style.display = 'none'; destStatusEl.textContent = ''; navPanelEl.style.display = 'none';
  activeRouteData = null; routeCoordsCache = [];
  destDistValEl.textContent = '--'; destTimeValEl.textContent = '--';
  if(destMarker && map){ map.removeLayer(destMarker); destMarker = null; }
  if(routeLine && map){ map.removeLayer(routeLine); routeLine = null; }
});

function handlePosition(pos){
  const { latitude, longitude, speed, heading } = pos.coords;
  let speedKmh = speed !== null && speed >= 0 ? Math.round(speed * 3.6) : lastSpeedKmh;
  let headingDeg = null;
  if(heading !== null && heading !== undefined && !isNaN(heading) && heading >= 0){
    headingDeg = heading;
  } else if(lastPos){
    headingDeg = bearing(lastPos.lat, lastPos.lon, latitude, longitude);
  }
  if(headingDeg === null || isNaN(headingDeg)){ headingDeg = lastHeading !== null ? lastHeading : 0; }

  if(lastHeading !== null && speedKmh > 20){
    let turnDiff = Math.abs(((headingDeg - lastHeading + 540) % 360) - 180);
    if(turnDiff > 45 && Date.now() - lastTurnSpoken > 25000){
      lastTurnSpoken = Date.now();
      speak('Aage tez mod hai, speed kam karein.');
      setAlert('⚠️ Tez mod (Sharp Turn) aage hai!', 'warn');
    }
  }
  lastHeading = headingDeg;

  if(lastPos){
    const d = haversineKm(lastPos.lat, lastPos.lon, latitude, longitude);
    tripDistanceKm += d;
    tripDistanceEl.textContent = tripDistanceKm.toFixed(1);
  }

  if(destination){
    const remDist = haversineKm(latitude, longitude, destination.lat, destination.lon);
    destDistValEl.textContent = remDist >= 1 ? remDist.toFixed(1) + ' km' : Math.round(remDist * 1000) + ' m';

    if(activeRouteData && activeRouteData.initialDistKm > 0){
      const ratio = Math.max(0, Math.min(1, remDist / activeRouteData.initialDistKm));
      const remMin = Math.round(activeRouteData.durationMin * ratio);
      destTimeValEl.textContent = remMin >= 60 ? (remMin/60).toFixed(1) + ' hrs' : remMin + ' min';

      // Off-route (100 m+) hone par, 30 second cooldown ke saath re-route
      if(routeCoordsCache.length > 1 && Date.now() - lastRerouteTime > 30000){
        if(distToRouteM(latitude, longitude, routeCoordsCache) > 100){
          lastRerouteTime = Date.now();
          buildRouteForDestination(latitude, longitude);
        }
      }
    } else {
      if(speedKmh > 5){
        const remMin = Math.round((remDist / speedKmh) * 60);
        destTimeValEl.textContent = remMin >= 60 ? (remMin/60).toFixed(1) + ' hrs' : remMin + ' min';
      }
      // Destination pehle set hui thi, ab GPS mila to route banao
      if(!routeRequestPending){
        routeRequestPending = true;
        buildRouteForDestination(latitude, longitude).finally(() => { routeRequestPending = false; });
      }
    }
  }

  speedValueEl.textContent = speedKmh;
  speedValueEl.className = 'speed-value' + (speedKmh > speedLimit ? ' over' : '');
  needleEl.style.transform = `rotate(${headingDeg}deg)`;
  compassLabelEl.textContent = `${compassLabel(headingDeg)} · ${Math.round(headingDeg)}°`;

  updateMap(latitude, longitude);
  updatePlaceName(latitude, longitude);
  if(destination) updateTurnByTurn(latitude, longitude);

  if(speedKmh > speedLimit && Date.now() - lastOverspeedSpoken > 20000){
    lastOverspeedSpoken = Date.now();
    speak(`Speed limit cross ho gayi hai, speed ${speedKmh} km/h hai.`);
  }
  lastPos = { lat: latitude, lon: longitude, time: Date.now() };
  lastSpeedKmh = speedKmh;
}

async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); }
  }catch(e){}
}
function releaseWakeLock(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if(tracking && document.visibilityState === 'visible') requestWakeLock();
});

startBtn.addEventListener('click', () => {
  if(tracking){
    tracking = false; startBtn.textContent = 'Start Ride'; startBtn.classList.remove('stop');
    statusDot.classList.remove('live'); navigator.geolocation.clearWatch(watchId);
    releaseWakeLock();
    setAlert('Ride ruk gayi.');
  } else {
    if(!('geolocation' in navigator)){ setAlert('GPS not supported', 'warn'); return; }
    tracking = true; startBtn.textContent = 'Stop Ride'; startBtn.classList.add('stop');
    statusDot.classList.add('live'); setAlert('Tracking shuru ho gayi!', 'ok');
    requestWakeLock();
    watchId = navigator.geolocation.watchPosition(handlePosition, () => setAlert('GPS Error: location permission check karein', 'warn'), { enableHighAccuracy: true });
  }
});

recenterBtn.addEventListener('click', () => {
  forceCenterOnNextUpdate = true;
  if(lastPos && map){
    map.setView([lastPos.lat, lastPos.lon], map.getZoom());
    setAlert('Map aapki live location par set ho gaya.', 'ok');
  } else {
    setAlert('Pehle "Start Ride" dabakar location on karein.', 'warn');
  }
});

talkBtn.addEventListener('click', () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ setAiStatus('Voice support available nahi hai.'); return; }
  const recognition = new SR(); recognition.lang = 'hi-IN';
  talkBtn.classList.add('listening'); talkBtn.textContent = '🎙️ Sun raha hoon...';

  recognition.onresult = (event) => {
    handleUserQuery(event.results[event.results.length - 1][0].transcript);
  };
  recognition.onend = () => { talkBtn.classList.remove('listening'); talkBtn.textContent = '🎤 Ya Bolkar Baat karein'; };
  try{ recognition.start(); }catch(e){ talkBtn.classList.remove('listening'); talkBtn.textContent = '🎤 Ya Bolkar Baat karein'; }
});
